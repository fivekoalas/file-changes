name: file-changes

description: Checks git diff against a group of regex or glob patterns (JSON-like input) and returns key-value pairs of results.

inputs:
  before_sha:
    description: The previous SHA.
    required: true
  current_sha:
    description: The current SHA.
    required: true
  regex_group:
    description: |
      A JSON-like string of pattern groups; patterns prefixed with `!` exclude files (e.g., '{"charts": ["^charts/.*/Chart.yaml$"]}' with pattern_type regex, or '{"deps": ["**", "!cypress/e2e/dynamic/**/*.ts", "!cypress/e2e/web/**/*.ts"], "dynamic": ["cypress/e2e/dynamic/**/*.cy.ts"], "web": ["cypress/e2e/web/**/*.cy.ts"]}' with pattern_type glob).
    required: true
  pattern_type:
    description: How patterns in regex_group are interpreted, `regex` (unanchored JavaScript regular expressions) or `glob`.
    required: false
    default: regex

outputs:
  results:
    description: The results of the regex group.
    value: ${{ steps.check.outputs.results }}

runs:
  using: composite
  steps:
    - name: Check file changes
      uses: actions/github-script@v9
      id: check
      env:
        # Passed through env instead of interpolated into the script to avoid script injection.
        INPUT_BEFORE_SHA: ${{ inputs.before_sha }}
        INPUT_CURRENT_SHA: ${{ inputs.current_sha }}
        INPUT_REGEX_GROUP: ${{ inputs.regex_group }}
        INPUT_PATTERN_TYPE: ${{ inputs.pattern_type }}
        FILE_CHANGES_PATH: ${{ github.action_path }}
      with:
        script: |
          const { run } = require(`${process.env.FILE_CHANGES_PATH}/src/file-changes.js`);
          await run({ core, exec });
